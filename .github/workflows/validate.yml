name: Validate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm-demo:
    name: Build or reuse WASM demo
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5291d5162b128faca9dd83edba24e7342730e604
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: my-farm-wasm-demo-v1
      bun_version: "1.3.14"
      rust_toolchain: "1.96.1"
      rust_targets: wasm32-unknown-unknown
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
      use_environment_v1: false
      setup_command: cargo install wasm-pack --version 0.15.0 --locked
      build_command: bun run build:wasm-demo
      artifact_paths: apps/web/src/generated/my_farm_wasm
      reuse_across_runs: true
      artifact_retention_days: 7

  validate-core:
    name: Core validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Verify generated contracts
        run: cargo run -p contract_codegen -- --check

      - name: Test mobile model and UI logic
        run: bun run test:mobile

  validate-web:
    name: Web validation
    needs:
      - build-wasm-demo
      - validate-core
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-wasm-demo.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified WASM demo
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-wasm-demo.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-wasm-demo.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-wasm-demo.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-wasm-demo.outputs.artifact_digest }}
          source_sha: ${{ needs.build-wasm-demo.outputs.source_sha }}
          artifact_key: ${{ needs.build-wasm-demo.outputs.artifact_key }}
          identity_digest: ${{ needs.build-wasm-demo.outputs.identity_digest }}
          destination_path: .artifacts/my-farm-wasm
          github_token: ${{ github.token }}

      - name: Stage verified WASM demo
        run: |
          rm -rf apps/web/src/generated/my_farm_wasm
          mkdir -p apps/web/src/generated
          cp -R .artifacts/my-farm-wasm/apps/web/src/generated/my_farm_wasm apps/web/src/generated/my_farm_wasm

      - name: Build web client
        run: bun run build:web:prepared

      - name: Build GitHub Pages runtime
        run: bun run build:pages:prepared

  validate:
    name: validate
    needs:
      - validate-core
      - validate-web
    runs-on: ubuntu-latest
    steps:
      - run: echo "Exact-head core and web validation succeeded."

  pages-build:
    name: Build Pages from verified WASM
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-wasm-demo
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-wasm-demo.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified WASM demo
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5291d5162b128faca9dd83edba24e7342730e604
        with:
          producer_run_id: ${{ needs.build-wasm-demo.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-wasm-demo.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-wasm-demo.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-wasm-demo.outputs.artifact_digest }}
          source_sha: ${{ needs.build-wasm-demo.outputs.source_sha }}
          artifact_key: ${{ needs.build-wasm-demo.outputs.artifact_key }}
          identity_digest: ${{ needs.build-wasm-demo.outputs.identity_digest }}
          destination_path: .artifacts/my-farm-wasm
          github_token: ${{ github.token }}

      - name: Stage verified WASM demo
        run: |
          rm -rf apps/web/src/generated/my_farm_wasm
          mkdir -p apps/web/src/generated
          cp -R .artifacts/my-farm-wasm/apps/web/src/generated/my_farm_wasm apps/web/src/generated/my_farm_wasm

      - name: Run Storybook tests
        run: bun run test:storybook

      - name: Run Pages demo tests without recompiling WASM
        env:
          MY_FARM_PREBUILT_WASM: "1"
        run: bun run test:e2e:pages-demo

      - name: Build Pages demo without recompiling WASM
        run: bun run build:pages:prepared

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - validate
      - pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
